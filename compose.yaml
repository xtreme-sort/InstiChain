services:
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: instichain
      POSTGRES_PASSWORD: instichain
      POSTGRES_DB: instichain
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U instichain -d instichain"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
