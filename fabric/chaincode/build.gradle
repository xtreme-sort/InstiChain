plugins {
    id 'com.gradleup.shadow' version '9.2.2'
    id 'application'
}

group = 'edu.iitm.instichain'
version = '2.0.0'

configurations {
    mockitoAgent
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.hyperledger.fabric-chaincode-java:fabric-chaincode-shim:2.5.10'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.18.2'

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.mockito:mockito-core:5.15.2'
    mockitoAgent('org.mockito:mockito-core:5.15.2') {
        transitive = false
    }
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

compileJava {
    options.release = 11
}

application {
    applicationName = 'instichain'
    mainClass = 'org.hyperledger.fabric.contract.ContractRouter'
}

test {
    useJUnitPlatform()
    jvmArgs "-javaagent:${configurations.mockitoAgent.asPath}"
}

shadowJar {
    archiveBaseName = 'chaincode'
    archiveVersion = ''
    archiveClassifier = ''
    mergeServiceFiles()
}

installDist.dependsOn test
